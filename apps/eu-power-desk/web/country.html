<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Country — EU Power Market Desk</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div class="brand">EU Power Market Desk</div>
        <nav class="main-nav">
          <a href="index.html" data-i18n="nav.home">Home</a>
          <a href="signals.html" data-i18n="nav.signals">Signals</a>
          <label class="locale-picker">
            <span data-i18n="nav.locale">UI</span>
            <select id="locale-select" aria-label="UI language">
              <option value="en" data-i18n="lang.en">English</option>
              <option value="de" data-i18n="lang.de">Deutsch</option>
              <option value="fr" data-i18n="lang.fr">Français</option>
              <option value="es" data-i18n="lang.es">Español</option>
              <option value="it" data-i18n="lang.it">Italiano</option>
            </select>
          </label>
        </nav>
      </div>
    </header>
    <main id="main"></main>
    <footer class="site-footer"><a href="index.html" data-i18n="country.back">← Back to regions</a></footer>
    <script src="app.js"></script>
    <script>
      async function initCountry() {
        const E = window.EUDesk;
        await E.bootCommon();
        E.wireLocaleSelect(document.getElementById("locale-select"));

        const main = document.getElementById("main");
        const slug = E.qs("slug") || "";

        function render() {
          main.innerHTML = "";
          const country = E.DATA.countries.countries.find((x) => x.slug === slug);

          if (!country) {
            document.title = "EU Power Market Desk";
            main.appendChild(document.createElement("h1")).textContent = E.t("country.not_found_title");
            main.appendChild(document.createElement("p")).textContent = E.t("country.not_found_body");
            return;
          }

          document.title = country.name + " — EU Power Market Desk";

          main.appendChild(document.createElement("h1")).textContent = country.name;
          const lede = document.createElement("p");
          lede.className = "lede";
          lede.textContent = country.summary || "";
          main.appendChild(lede);

          if (country.developer_conditions) {
            const dev = document.createElement("div");
            dev.className = "panel";
            const dh = document.createElement("strong");
            dh.setAttribute("data-i18n", "country.developer_heading");
            dh.textContent = E.t("country.developer_heading");
            const dp = document.createElement("p");
            dp.className = "item-summary";
            dp.style.marginTop = "8px";
            dp.textContent = country.developer_conditions;
            dev.appendChild(dh);
            dev.appendChild(dp);
            main.appendChild(dev);
          }

          const bess = document.createElement("div");
          bess.className = "panel";
          const bh = document.createElement("strong");
          bh.setAttribute("data-i18n", "country.bess_heading");
          bh.textContent = E.t("country.bess_heading");
          const bp = document.createElement("p");
          bp.className = "item-summary";
          bp.style.marginTop = "8px";
          bp.textContent = country.bess_framing || "";
          bess.appendChild(bh);
          bess.appendChild(bp);
          main.appendChild(bess);

          const h2 = document.createElement("h2");
          h2.setAttribute("data-i18n", "country.signals_for");
          h2.textContent = E.t("country.signals_for");
          main.appendChild(h2);

          const items = (E.DATA.items.items || []).filter((it) => (it.country || "") === slug);
          if (!items.length) {
            const wrap = document.createElement("p");
            wrap.className = "empty";
            wrap.appendChild(document.createTextNode(E.t("country.no_items") + " "));
            const a = document.createElement("a");
            a.href = "signals.html";
            a.setAttribute("data-i18n", "country.open_full_feed");
            a.textContent = E.t("country.open_full_feed");
            wrap.appendChild(a);
            main.appendChild(wrap);
          } else {
            items.forEach((it) => main.appendChild(E.renderItemCard(it)));
          }

          const nav = document.createElement("p");
          nav.className = "lede";
          const filter = document.createElement("a");
          filter.href = "signals.html?country=" + encodeURIComponent(slug);
          filter.setAttribute("data-i18n", "country.filter_signals");
          filter.textContent = E.t("country.filter_signals");
          nav.appendChild(filter);
          main.appendChild(nav);

          E.applyDomTranslations(main);
        }

        render();
        window.addEventListener("eudesk-locale-change", render);
      }

      initCountry().catch((err) => {
        console.error(err);
        document.getElementById("main").textContent = "Failed to load: " + err.message;
      });
    </script>
  </body>
</html>
